schema_version = "1.0.0"

id = "stub_switch"
version = "0.9.0"
name = "Stub Switch Generator"
tagline = "3D-printable model railroad stub switch tie strips, rail and frog"
maintainer = "John <john@singerlinks.com>"
type = "add-on"

blender_version_min = "4.5.0"

